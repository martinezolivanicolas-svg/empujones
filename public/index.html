<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Empujones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #14121f; --panel: #221e35; --ink: #f6f2ff; --muted: #a49cc4; --accent: #ffd23f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: 'Nunito', system-ui, sans-serif; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #join { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(circle at 50% 30%, #2d2650, var(--bg) 70%); z-index: 10; }
    .card { width: min(380px, 100%); background: var(--panel); border-radius: 22px; padding: 28px;
      box-shadow: 0 20px 60px #0008; text-align: center; }
    h1 { font-family: 'Lilita One', sans-serif; font-size: 52px; margin: 0; letter-spacing: 1px;
      color: var(--accent); text-shadow: 4px 4px 0 #ff5d5d; transform: rotate(-3deg); }
    .sub { color: var(--muted); margin: 10px 0 22px; }
    label { display: block; text-align: left; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 2px solid #3a3358;
      background: #17142a; color: var(--ink); font: inherit; font-size: 17px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { margin-top: 20px; width: 100%; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
      background: var(--accent); color: #241c00; font-family: 'Lilita One', sans-serif; font-size: 24px;
      box-shadow: 0 5px 0 #b8900c; }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8900c; }
    .how { margin-top: 18px; font-size: 14px; color: var(--muted); line-height: 1.6; }
    kbd { background: #17142a; border: 1px solid #3a3358; border-radius: 6px; padding: 1px 6px; color: var(--ink); }
    #share { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #0007;
      padding: 8px 14px; border-radius: 999px; font-size: 13px; color: var(--muted); cursor: pointer;
      display: none; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="share" title="Copiar enlace"></div>

  <div id="join">
    <div class="card">
      <h1>EMPUJONES</h1>
      <p class="sub">Tira a tus amigos de la arena.<br>El último en pie gana.</p>
      <label for="name">Tu nombre</label>
      <input id="name" maxlength="14" placeholder="Ej: Nico" autocomplete="off">
      <label for="room">Sala (los que pongan la misma juegan juntos)</label>
      <input id="room" maxlength="20" placeholder="principal" autocomplete="off">
      <button id="play">¡JUGAR!</button>
      <div class="how">
        Moverse: <kbd>WASD</kbd> o flechas<br>
        Embestir: <kbd>Espacio</kbd><br>
        Móvil: arrastra para moverte, toca con otro dedo para embestir
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
